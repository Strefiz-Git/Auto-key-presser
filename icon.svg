<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#152a63"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7f5"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1a3d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="none" stroke="#a9c8ff" stroke-width="4" opacity="0.6"/>

  <!-- Click pulse rings behind key -->
  <circle cx="176" cy="176" r="34" fill="url(#pulse)"/>

  <!-- F Key -->
  <g filter="url(#softShadow)">
    <rect x="68" y="68" width="108" height="108" rx="24" fill="url(#key)"/>
    <rect x="68" y="68" width="108" height="108" rx="24" fill="none" stroke="#c3cfe4" stroke-width="3"/>
    <text x="122" y="152" font-family="Arial, sans-serif" font-size="82" font-weight="700" text-anchor="middle" fill="#1e3a8a">F</text>
  </g>

  <!-- Cursor with click rings, anchored bottom-right -->
  <g filter="url(#softShadow)">
    <path d="M168 130 L214 170 L196 174 L206 196 L192 202 L182 180 L168 190 Z"
          fill="#fbbf24" stroke="#8a5a00" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Motion / auto-repeat arcs -->
  <path d="M196 96 A46 46 0 0 1 210 130" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M182 84 A64 64 0 0 1 214 118" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
</svg>